# Temporary: report which page elements sit in the top corners of the reader.
name: inspect
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install selenium
      - name: Inspect
        run: |
          python3 tests/make_sample_pdf.py "$RUNNER_TEMP/sample.pdf"
          mkdir -p "$RUNNER_TEMP/prof/chrome"
          cp profile/user.js "$RUNNER_TEMP/prof/"
          cp profile/chrome/*.css "$RUNNER_TEMP/prof/chrome/"
          cat > "$RUNNER_TEMP/inspect.py" <<'EOF'
          import json, os, sys, time
          from selenium import webdriver
          from selenium.webdriver.firefox.options import Options
          o = Options()
          o.add_argument("-headless")
          o.add_argument("-profile"); o.add_argument(sys.argv[1])
          o.add_argument("--width=1280"); o.add_argument("--height=800")
          d = webdriver.Firefox(options=o)
          d.get("file://" + sys.argv[2])
          time.sleep(8)
          js = """
          const out = {};
          for (const [x, y] of [[8, 20], [1265, 20], [640, 20]]) {
            out[x + ',' + y] = document.elementsFromPoint(x, y).slice(0, 8).map(e => {
              const s = getComputedStyle(e);
              return `${e.tagName}#${e.id}.${[...e.classList].join('.')} bg=${s.backgroundColor} z=${s.zIndex} pos=${s.position}`;
            });
          }
          out.bars = [...document.querySelectorAll('[class*=essage], [class*=anner], [class*=allout], [id*=anner], [id*=allout], [role=status], [role=alert]')]
            .filter(e => e.getClientRects().length)
            .map(e => `${e.tagName}#${e.id}.${[...e.classList].join('.')} ${JSON.stringify(e.getBoundingClientRect())} text=${e.textContent.trim().slice(0, 120)}`);
          return JSON.stringify(out, null, 1);
          """
          print(d.execute_script(js))
          d.quit()
          EOF
          python3 "$RUNNER_TEMP/inspect.py" "$RUNNER_TEMP/prof" "$RUNNER_TEMP/sample.pdf"
