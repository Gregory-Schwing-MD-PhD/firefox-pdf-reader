# Installs the reader on real macOS, Windows and Ubuntu runners and in a
# Debian container set up like ChromeOS's Linux environment, opens a test PDF
# through the OS's default-app mechanism, checks Firefox started in kiosk mode
# with the reader's profile, and saves a screenshot of what's on screen.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Make sure Firefox is installed
        run: |
          [ -d /Applications/Firefox.app ] || brew install --cask firefox
          defaults read /Applications/Firefox.app/Contents/Info.plist CFBundleShortVersionString

      - name: Install the reader
        run: ./macos/install.sh

      - name: Check the app bundle
        run: |
          APP="$HOME/Applications/Firefox PDF Reader.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:0:LSItemContentTypes:0" "$APP/Contents/Info.plist" | grep -qx com.adobe.pdf
          codesign --verify --verbose "$APP"

      - name: Check it is the default PDF app
        id: default
        continue-on-error: true
        run: |
          cp docs/example.pdf "$RUNNER_TEMP/sample.pdf"
          HANDLER="$(osascript -l JavaScript -e "ObjC.import('AppKit'); \$.NSWorkspace.sharedWorkspace.URLForApplicationToOpenURL(\$.NSURL.fileURLWithPath('$RUNNER_TEMP/sample.pdf')).path.js")"
          echo "PDF handler: $HANDLER"
          [ "$HANDLER" = "$HOME/Applications/Firefox PDF Reader.app" ]

      - name: Open the PDF like a double-click
        run: |
          # Use the default handler if it was set, otherwise open with the app directly
          if [ "${{ steps.default.outcome }}" = success ]; then
            open "$RUNNER_TEMP/sample.pdf"
          else
            open -a "$HOME/Applications/Firefox PDF Reader.app" "$RUNNER_TEMP/sample.pdf"
          fi
          for i in $(seq 1 60); do
            pgrep -f -- "--kiosk.*sample.pdf" >/dev/null && break; sleep 1
          done
          ps -axo command | grep -- "--kiosk" | grep -v grep
          ps -axo command | grep -- "--kiosk" | grep -q "Application Support/FirefoxPDF"

      - name: Check Firefox loaded the reader settings
        run: |
          PREFS="$HOME/Library/Application Support/FirefoxPDF/prefs.js"
          for i in $(seq 1 60); do grep -q 'pdfjs.defaultZoomValue' "$PREFS" 2>/dev/null && break; sleep 1; done
          grep -E 'pdfjs\.(defaultZoomValue|forcePageColors|viewerCssTheme)|legacyUserProfileCustomizations' "$PREFS"

      - name: Screenshot
        if: always()
        run: |
          sleep 10
          screencapture -x "$RUNNER_TEMP/screenshot-${{ matrix.os }}.png" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.os }}
          path: ${{ runner.temp }}/screenshot-*.png
          if-no-files-found: ignore

      - name: Uninstall
        run: |
          pkill -f -- "--kiosk" || true
          sleep 2
          ./macos/uninstall.sh --remove-profile
          test ! -e "$HOME/Applications/Firefox PDF Reader.app"

      # --- The download: FirefoxPDFReader.dmg, installed by dragging ---
      - name: Build the disk image
        run: bash ./macos/build-dmg.sh dist "1.0.${{ github.run_number }}"

      - name: Install from the disk image (drag to Applications)
        run: |
          hdiutil attach dist/FirefoxPDFReader.dmg -nobrowse -mountpoint /Volumes/FirefoxPDFReader
          ls -la /Volumes/FirefoxPDFReader
          test -L /Volumes/FirefoxPDFReader/Applications
          cp -R "/Volumes/FirefoxPDFReader/Firefox PDF Reader.app" /Applications/
          hdiutil detach /Volumes/FirefoxPDFReader

      - name: First launch sets it up
        run: |
          open -a "/Applications/Firefox PDF Reader.app"
          PROFILE="$HOME/Library/Application Support/FirefoxPDF"
          for i in $(seq 1 60); do [ -f "$PROFILE/.default-app" ] && break; sleep 1; done
          ls -la "$PROFILE" "$PROFILE/chrome"
          HANDLER="$(osascript -l JavaScript -e "ObjC.import('AppKit'); \$.NSWorkspace.sharedWorkspace.URLForApplicationToOpenURL(\$.NSURL.fileURLWithPath('$RUNNER_TEMP/sample.pdf')).path.js")"
          echo "PDF handler: $HANDLER"
          # Newer macOS waits for the person to click "Use Firefox PDF Reader",
          # which a test can't do; older macOS switches straight away.
          if [ "$HANDLER" = "/Applications/Firefox PDF Reader.app" ]; then echo "IS_DEFAULT=1" >> "$GITHUB_ENV"
          else echo "::notice::Default not switched yet: macOS is asking the user to confirm"; fi
          # Close the welcome dialog
          pkill -f "Firefox PDF Reader.app" || true

      - name: Double-click a PDF
        run: |
          if [ "${IS_DEFAULT:-}" = 1 ]; then open "$RUNNER_TEMP/sample.pdf"
          else open -a "/Applications/Firefox PDF Reader.app" "$RUNNER_TEMP/sample.pdf"; fi
          for i in $(seq 1 60); do pgrep -f -- "--kiosk.*sample.pdf" >/dev/null && break; sleep 1; done
          ps -axo command | grep -- "--kiosk" | grep -v grep | grep -q "Application Support/FirefoxPDF"

      - name: Screenshot (disk image install)
        if: always()
        run: |
          sleep 10
          screencapture -x "$RUNNER_TEMP/dmg-screenshot-${{ matrix.os }}.png" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-screenshot-${{ matrix.os }}
          path: ${{ runner.temp }}/dmg-screenshot-*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15'
        with:
          name: package-dmg
          path: dist/FirefoxPDFReader.dmg

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox imagemagick xdg-utils desktop-file-utils
          command -v firefox && firefox --version
          # A virtual screen with a window manager (kiosk full screen needs one, as on any desktop)
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          DISPLAY=:99 openbox &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Install the reader
        run: ./linux/install.sh

      - name: Check it is the default PDF app
        run: |
          test -x "$HOME/.local/bin/firefox-pdf-reader"
          desktop-file-validate "$HOME/.local/share/applications/firefox-pdf-reader.desktop"
          [ "$(xdg-mime query default application/pdf)" = "firefox-pdf-reader.desktop" ]

      - name: Open the PDF through the desktop entry
        run: |
          cp docs/example.pdf "$RUNNER_TEMP/sample.pdf"
          gtk-launch firefox-pdf-reader "$RUNNER_TEMP/sample.pdf" || "$HOME/.local/bin/firefox-pdf-reader" "$RUNNER_TEMP/sample.pdf" &
          for i in $(seq 1 60); do pgrep -f -- "--kiosk" >/dev/null && break; sleep 1; done
          ps -eo args | grep -- "--kiosk" | grep -v grep
          ps -eo args | grep -- "--kiosk" | grep -q "firefox-pdf-reader"

      - name: Check Firefox loaded the reader settings
        run: |
          PREFS="$(sed -n 's/.*-profile "\([^"]*\)".*/\1/p' "$HOME/.local/bin/firefox-pdf-reader")/prefs.js"
          echo "$PREFS"
          for i in $(seq 1 60); do grep -q 'pdfjs.defaultZoomValue' "$PREFS" 2>/dev/null && break; sleep 1; done
          grep -E 'pdfjs\.(defaultZoomValue|forcePageColors|viewerCssTheme)|legacyUserProfileCustomizations' "$PREFS"

      - name: Screenshot
        if: always()
        run: |
          sleep 10
          import -window root "$RUNNER_TEMP/screenshot-ubuntu.png" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-ubuntu
          path: ${{ runner.temp }}/screenshot-*.png
          if-no-files-found: ignore

      - name: Uninstall
        run: |
          pkill -f -- "--kiosk" || true
          sleep 2
          ./linux/uninstall.sh --remove-profile
          test ! -e "$HOME/.local/bin/firefox-pdf-reader"

      - name: One-step installer (docs/install/install.sh)
        run: |
          sh docs/install/install.sh
          test -x "$HOME/.local/bin/firefox-pdf-reader"
          [ "$(xdg-mime query default application/pdf)" = "firefox-pdf-reader.desktop" ]
          ./linux/uninstall.sh --remove-profile

      # --- The download: firefox-pdf-reader .deb, installed by double-clicking ---
      - name: Build the .deb
        run: sh linux/package/build-deb.sh dist "1.0.${{ github.run_number }}"

      - name: Install the .deb (what double-clicking it does)
        run: |
          rm -f "$HOME/.config/mimeapps.list"   # forget the per-user default from the earlier tests
          sudo apt-get install -y ./dist/firefox-pdf-reader_*_all.deb
          dpkg -L firefox-pdf-reader
          grep pdf /etc/xdg/mimeapps.list
          [ "$(xdg-mime query default application/pdf)" = "firefox-pdf-reader.desktop" ]

      - name: Double-click a PDF
        run: |
          pkill -f -- "--kiosk" || true; sleep 2
          gtk-launch firefox-pdf-reader "$RUNNER_TEMP/sample.pdf" || firefox-pdf-reader "$RUNNER_TEMP/sample.pdf" &
          for i in $(seq 1 60); do pgrep -f -- "--kiosk" >/dev/null && break; sleep 1; done
          ps -eo args | grep -- "--kiosk" | grep -v grep | grep -q "firefox-pdf-reader"

      - name: Screenshot (.deb install)
        if: always()
        run: |
          sleep 10
          import -window root "$RUNNER_TEMP/deb-screenshot-ubuntu.png" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deb-screenshot-ubuntu
          path: ${{ runner.temp }}/deb-screenshot-ubuntu.png
          if-no-files-found: ignore

      - name: Remove the .deb
        run: |
          pkill -f -- "--kiosk" || true
          sudo apt-get remove -y firefox-pdf-reader
          ! grep -q firefox-pdf-reader /etc/xdg/mimeapps.list

      - uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: dist/firefox-pdf-reader_*_all.deb

  # ChromeOS's Linux environment (Crostini) is a Debian 12 container with a
  # regular user who has password-less sudo. GitHub can't run ChromeOS itself,
  # so this recreates that: Debian 12, Crostini's marker directory, and a
  # normal user running the ChromeOS installer.
  chromeos:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    env:
      AS_USER: runuser -u penguin -- env HOME=/home/penguin DISPLAY=:99
    steps:
      - uses: actions/checkout@v4

      - name: Set up a Crostini-like container
        run: |
          apt-get update
          apt-get install -y sudo python3 xvfb openbox imagemagick xdg-utils desktop-file-utils procps
          mkdir -p /opt/google/cros-containers
          useradd -m -s /bin/bash penguin
          echo 'penguin ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/penguin
          cp -r "$GITHUB_WORKSPACE" /home/penguin/firefox-pdf-reader
          chown -R penguin:penguin /home/penguin/firefox-pdf-reader
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          DISPLAY=:99 openbox &

      - name: Install the reader (installs Firefox ESR first)
        run: $AS_USER sh /home/penguin/firefox-pdf-reader/chromeos/install.sh

      - name: Check it is the default PDF app
        run: |
          command -v firefox-esr
          [ "$($AS_USER xdg-mime query default application/pdf)" = "firefox-pdf-reader.desktop" ]

      - name: Open the PDF
        run: |
          cp docs/example.pdf /home/penguin/sample.pdf && chown penguin /home/penguin/sample.pdf
          $AS_USER /home/penguin/.local/bin/firefox-pdf-reader /home/penguin/sample.pdf > /tmp/firefox.log 2>&1 &
          for i in $(seq 1 60); do pgrep -f -- "--kiosk" >/dev/null && break; sleep 1; done
          ps -eo user,args | grep -- "--kiosk" | grep -v grep
          ps -eo user,args | grep -- "--kiosk" | grep -q "^penguin"

      - name: Check Firefox loaded the reader settings
        run: |
          PREFS="/home/penguin/.local/share/firefox-pdf-reader/prefs.js"
          for i in $(seq 1 60); do grep -q 'pdfjs.defaultZoomValue' "$PREFS" 2>/dev/null && break; sleep 1; done
          grep -E 'pdfjs\.(defaultZoomValue|forcePageColors|viewerCssTheme)|legacyUserProfileCustomizations' "$PREFS" || { cat /tmp/firefox.log; exit 1; }

      - name: Screenshot
        if: always()
        run: |
          sleep 10
          DISPLAY=:99 import -window root /tmp/screenshot-chromeos.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-chromeos
          path: /tmp/screenshot-chromeos.png
          if-no-files-found: ignore

      # --- The .deb, as ChromeOS's Files app installs it ("Install with Linux") ---
      - name: Install the .deb
        run: |
          pkill -f -- "--kiosk" || true
          sh linux/package/build-deb.sh /tmp/dist "1.0.${{ github.run_number }}"
          sh /home/penguin/firefox-pdf-reader/linux/uninstall.sh --remove-profile || true
          rm -f /home/penguin/.config/mimeapps.list
          apt-get install -y /tmp/dist/firefox-pdf-reader_*_all.deb
          [ "$($AS_USER xdg-mime query default application/pdf)" = "firefox-pdf-reader.desktop" ]

      - name: Open a PDF with the installed package
        run: |
          $AS_USER firefox-pdf-reader /home/penguin/sample.pdf > /tmp/firefox-deb.log 2>&1 &
          for i in $(seq 1 60); do pgrep -f -- "--kiosk" >/dev/null && break; sleep 1; done
          ps -eo user,args | grep -- "--kiosk" | grep -v grep | grep -q "^penguin" || { cat /tmp/firefox-deb.log; exit 1; }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make sure Firefox is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles\Mozilla Firefox\firefox.exe")) { choco install firefox -y --no-progress }
          (Get-Item "$env:ProgramFiles\Mozilla Firefox\firefox.exe").VersionInfo.ProductVersion

      - name: Install the reader
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\windows\install.ps1 -SkipDefaultAppsPage

      - name: Check the registration
        shell: pwsh
        run: |
          $exe = "$env:USERPROFILE\FirefoxPDF\FirefoxPDF.exe"
          if (-not (Test-Path $exe)) { throw "launcher missing" }
          (Get-ItemProperty 'HKCU:\Software\Classes\FirefoxPDFReader\shell\open\command').'(default)'
          (Get-ItemProperty 'HKCU:\Software\RegisteredApplications').FirefoxPDFReader
          Get-ItemProperty 'HKCU:\Software\Classes\.pdf\OpenWithProgids' -Name FirefoxPDFReader | Out-Null

      - name: Open the PDF with the launcher
        shell: pwsh
        run: |
          Copy-Item docs\example.pdf "$env:RUNNER_TEMP\sample.pdf"
          Start-Process "$env:USERPROFILE\FirefoxPDF\FirefoxPDF.exe" -ArgumentList "`"$env:RUNNER_TEMP\sample.pdf`""
          for ($i = 0; $i -lt 60; $i++) {
            $p = Get-CimInstance Win32_Process -Filter "Name='firefox.exe'" | Where-Object { $_.CommandLine -match '--kiosk' }
            if ($p) { break }; Start-Sleep 1
          }
          $p | Select-Object -First 1 -ExpandProperty CommandLine
          if (-not ($p.CommandLine -match 'FirefoxPDF')) { throw "Firefox was not started with the reader profile" }

      - name: Check Firefox loaded the reader settings
        shell: pwsh
        run: |
          $prefs = "$env:USERPROFILE\FirefoxPDF\prefs.js"
          for ($i = 0; $i -lt 60; $i++) { if ((Test-Path $prefs) -and (Select-String -Path $prefs -Pattern 'pdfjs.defaultZoomValue' -Quiet)) { break }; Start-Sleep 1 }
          Select-String -Path $prefs -Pattern 'pdfjs\.(defaultZoomValue|forcePageColors|viewerCssTheme)|legacyUserProfileCustomizations' | ForEach-Object Line

      - name: Screenshot
        if: always()
        shell: pwsh
        run: |
          Start-Sleep 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\screenshot-windows.png")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-windows
          path: ${{ runner.temp }}/screenshot-windows.png
          if-no-files-found: ignore

      - name: Uninstall
        shell: powershell
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          powershell -ExecutionPolicy Bypass -File .\windows\uninstall.ps1 -RemoveProfile
          if (Test-Path 'HKCU:\Software\Classes\FirefoxPDFReader') { throw "registry entries left behind" }

      - name: One-step installer (docs/install/windows.ps1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\docs\install\windows.ps1
          if (-not (Test-Path "$env:USERPROFILE\FirefoxPDF\FirefoxPDF.exe")) { throw "launcher missing" }
          if (-not (Test-Path 'HKCU:\Software\Classes\FirefoxPDFReader')) { throw "not registered" }
          powershell -ExecutionPolicy Bypass -File .\windows\uninstall.ps1 -RemoveProfile

  # After every platform passes on main, publish the downloads to the
  # "latest" release, so these links always serve the newest version:
  #   https://github.com/Gregory-Schwing-MD-PhD/firefox-pdf-reader/releases/latest/download/FirefoxPDFReader.dmg
  #   https://github.com/Gregory-Schwing-MD-PhD/firefox-pdf-reader/releases/latest/download/FirefoxPDFReader.deb
  #   https://github.com/Gregory-Schwing-MD-PhD/firefox-pdf-reader/releases/latest/download/FirefoxPDFReader-Setup.cmd
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [macos, linux, chromeos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Publish the downloads
        run: |
          mkdir -p upload
          cp dist/FirefoxPDFReader.dmg upload/FirefoxPDFReader.dmg
          cp dist/firefox-pdf-reader_*_all.deb upload/FirefoxPDFReader.deb
          cp docs/install/FirefoxPDFReader-Setup.cmd upload/FirefoxPDFReader-Setup.cmd
          ls -la upload
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Firefox PDF Reader" --latest \
              --notes "Downloads for Firefox PDF Reader. Get the right one for your computer at https://gregory-schwing-md-phd.github.io/firefox-pdf-reader/"
          fi
          gh release upload latest upload/* --clobber
          gh release edit latest --notes "Downloads for Firefox PDF Reader, built from ${GITHUB_SHA::7} (run ${{ github.run_number }}). Get the right one for your computer at https://gregory-schwing-md-phd.github.io/firefox-pdf-reader/"
