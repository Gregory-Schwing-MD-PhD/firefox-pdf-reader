# Installs the reader on real macOS, Windows and Ubuntu runners and in a
# Debian container set up like ChromeOS's Linux environment, then uses it the
# way a person would and checks what they would see:
#   - the reader's profile and settings are in place;
#   - a PDF opened like a double-click gets a window of its own, titled with
#     the PDF's file name, filling the screen under the system's title bar;
#   - a second PDF opened while the reader runs gets a second window of the
#     same running reader (the system's own window list shows both);
#   - a colour figure keeps its colours and sharpness: the screen is compared
#     with poppler's drawing of the same page (tests/compare_colours.py);
#   - pages are black and text white, while a greyscale picture and a chart's
#     colours stay as the PDF has them (tests/check_dark_page.py, on a page
#     made by tests/make_test_pdfs.py, opened under a file name with spaces,
#     #, &, % and an accented letter);
#   - on a second page made there (tests/check_mixed_page.py): a scanned page
#     stored as a picture of the paper with its letters as black stencils
#     keeps dark letters on light paper; text stays readable on coloured
#     boxes (a pale box turns dark and its text white; text on a strong
#     colour keeps its colour); labels on pictures drawn many times over
#     keep their colours;
#   - a web link in the PDF opens in a new window;
#   - a PDF given by its file:// address opens in the reader's viewer (Linux,
#     Windows), and a PDF on the web in Firefox's own viewer (Linux);
#   - Alt+Tab (Cmd+` on macOS) switches between the PDFs' windows;
#   - F11 (Ctrl+Cmd+F on macOS) makes a window full screen, with a short note
#     saying how to leave, and F11 (Esc on macOS) takes it back to a window;
#   - Ctrl+W / Alt+F4 (Cmd+W / Cmd+Q) close the windows and the reader;
# and saves a screenshot of every step, and the colour comparison, as artifacts.
# The viewer job checks that viewer/ is exactly pdf.js's release with the
# reader's changes (tools/make_viewer.py).
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make sure Firefox is installed
        run: |
          [ -d /Applications/Firefox.app ] || brew install --cask firefox
          defaults read /Applications/Firefox.app/Contents/Info.plist CFBundleShortVersionString

      - name: Install test tools and make the test PDFs
        run: |
          brew install poppler
          python -m pip install --quiet pypdf pillow numpy
          echo "PDFS=$RUNNER_TEMP/pdfs" >> "$GITHUB_ENV"
          echo "SHOTS=$RUNNER_TEMP/shots" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/shots"
          python tests/make_test_pdfs.py "$RUNNER_TEMP/pdfs"
          cp "$RUNNER_TEMP/pdfs/chart.pdf" "$RUNNER_TEMP/pdfs/chart page #1 & 50% é.pdf"

      - name: Install the reader
        run: |
          ./macos/install.sh
          . tests/macos/reader-windows.sh
          sleep 3
          answer_default_app_question

      - name: Check the app bundle
        run: |
          APP="$HOME/Applications/Firefox PDF Reader.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:0:LSItemContentTypes:0" "$APP/Contents/Info.plist" | grep -qx com.adobe.pdf
          codesign --verify --verbose "$APP"

      - name: Check the profile
        run: |
          P="$HOME/Library/Application Support/FirefoxPDF"
          ls -la "$P" "$P/chrome"
          cmp profile/user.js "$P/user.js"
          cmp profile/chrome/userChrome.css "$P/chrome/userChrome.css"
          cmp profile/chrome/userContent.css "$P/chrome/userContent.css"
          diff -r viewer "$P/viewer" && echo "viewer: $(cat "$P/viewer/VERSION")"
          grep -q '"sizemode":"maximized"' "$P/xulstore.json"

      - name: Check it is the default PDF app
        id: default
        continue-on-error: true
        run: |
          HANDLER="$(osascript -l JavaScript -e "ObjC.import('AppKit'); \$.NSWorkspace.sharedWorkspace.URLForApplicationToOpenURL(\$.NSURL.fileURLWithPath('$PDFS/paper.pdf')).path.js")"
          echo "PDF handler: $HANDLER"
          [ "$HANDLER" = "$HOME/Applications/Firefox PDF Reader.app" ]

      - name: Open a PDF like a double-click
        run: |
          . tests/macos/reader-windows.sh
          # Use the default handler if it was set, otherwise open with the app directly
          if [ "${{ steps.default.outcome }}" = success ]; then open "$PDFS/paper.pdf"
          else open -a "$HOME/Applications/Firefox PDF Reader.app" "$PDFS/paper.pdf"; fi
          wait_title paper.pdf 90
          answer_default_app_question
          sleep 5
          shot "$SHOTS/1-first-pdf.png"
          echo "--- windows:"; reader_windows
          echo "--- processes:"; reader_processes
          reader_processes | grep 'Application Support/FirefoxPDF' | grep -q -- '-new-window .*paper.pdf'
          if front_is_fullscreen; then echo "MISS: the window is full screen"; exit 1; fi
          front_fills_screen

      - name: Open a second PDF while the reader runs
        run: |
          . tests/macos/reader-windows.sh
          open -a "$HOME/Applications/Firefox PDF Reader.app" "$PDFS/figure.pdf"
          wait_windows 2 90
          wait_title figure.pdf
          sleep 5
          echo "--- System Events' window list (what Cmd+\` goes through), front first:"; reader_windows
          echo "--- the window server's list:"; window_server_list
          echo "--- Firefox main processes (one running reader):"; reader_processes
          [ "$(reader_processes | grep -c .)" -eq 1 ]
          front_title | grep -q figure.pdf
          front_fills_screen
          sleep 8   # pages drawn
          shot "$SHOTS/2-second-pdf.png"

      - name: Check Firefox loaded the reader settings
        run: |
          PREFS="$HOME/Library/Application Support/FirefoxPDF/prefs.js"
          for i in $(seq 1 60); do grep -q 'browser.tabs.inTitlebar' "$PREFS" 2>/dev/null && break; sleep 1; done
          grep -E 'pdfjs\.|inTitlebar|open_newwindow|legacyUserProfileCustomizations|fullscreen|fileuri' "$PREFS"
          if grep -q '"pdfjs.forcePageColors", true' "$PREFS"; then echo "MISS: pages are still recoloured"; exit 1; fi
          grep -q '"browser.tabs.inTitlebar", 0' "$PREFS"
          grep -q '"security.fileuri.strict_origin_policy", false' "$PREFS"

      - name: Colours and sharpness of a colour figure, against poppler's drawing
        run: python tests/compare_colours.py "$SHOTS/2-second-pdf.png" "$PDFS/figure.pdf" "$SHOTS" --name colours-${{ matrix.os }}

      - name: A web link in the PDF opens in a new window
        run: |
          . tests/macos/reader-windows.sh
          # The test PDF has an invisible link to example.com across the band
          # 20-50 points below the top of its page (tests/make_test_pdfs.py)
          bring_front
          click_page_point "$SHOTS/colours-${{ matrix.os }}.json" 35
          wait_windows 3 60
          wait_title "Example Domain" 60
          sleep 2
          shot "$SHOTS/2b-link-in-new-window.png"
          press 13 command
          wait_windows 2
          front_title | grep -q figure.pdf

      - name: Cmd+` switches to the other PDF
        run: |
          . tests/macos/reader-windows.sh
          bring_front
          press 50 command
          sleep 3
          echo "front: $(front_title)"
          front_title | grep -q paper.pdf
          shot "$SHOTS/3-cmd-backquote.png"

      - name: Ctrl+Cmd+F makes it full screen, Esc takes it back to a window
        run: |
          . tests/macos/reader-windows.sh
          press 3 control command
          sleep 3
          front_is_fullscreen
          shot "$SHOTS/4-full-screen-with-note.png"
          sleep 8
          press 53
          sleep 4
          if front_is_fullscreen; then echo "MISS: the window is full screen"; exit 1; fi
          front_fills_screen
          shot "$SHOTS/5-window-again.png"

      - name: A page of text, a picture and a chart - black page, white text, the picture and the chart in their own colours
        run: |
          . tests/macos/reader-windows.sh
          open -a "$HOME/Applications/Firefox PDF Reader.app" "$PDFS/chart page #1 & 50% é.pdf"
          wait_windows 3 90
          wait_title "chart page #1 & 50%"
          bring_front
          echo "front: $(front_title)"; front_title | grep -qF "chart page #1 & 50%"
          sleep 8   # page drawn
          shot "$SHOTS/6-chart-page.png"
          python tests/check_dark_page.py "$SHOTS/6-chart-page.png" "$PDFS/chart.pdf" "$SHOTS" --name dark-page-${{ matrix.os }}
          # Find: Cmd+F opens the viewer's find bar at the top right
          press 3 command
          sleep 1
          osascript -e 'tell application "System Events" to keystroke "picture"'
          press 36
          sleep 2
          shot "$SHOTS/6b-find.png"
          python tests/find_bar_shown.py "$SHOTS/6-chart-page.png" "$SHOTS/6b-find.png" "$SHOTS/dark-page-${{ matrix.os }}.json"
          press 53
          sleep 1
          press 13 command
          wait_windows 2

      - name: A scanned page, coloured boxes and labels on pictures - dark letters on their paper, readable text on every box
        run: |
          . tests/macos/reader-windows.sh
          open -a "$HOME/Applications/Firefox PDF Reader.app" "$PDFS/mixed.pdf"
          wait_windows 3 90
          wait_title mixed.pdf
          bring_front
          echo "front: $(front_title)"; front_title | grep -q mixed.pdf
          sleep 8   # page drawn
          shot "$SHOTS/6c-mixed-page.png"
          python tests/check_mixed_page.py "$SHOTS/6c-mixed-page.png" "$PDFS/mixed.pdf" "$SHOTS" --name mixed-page-${{ matrix.os }}
          press 13 command
          wait_windows 2

      - name: Cmd+W closes one PDF, Cmd+Q the reader
        run: |
          . tests/macos/reader-windows.sh
          press 13 command
          wait_windows 1
          press 12 command
          for i in $(seq 1 30); do [ -z "$(reader_processes)" ] && break; sleep 1; done
          [ -z "$(reader_processes)" ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Uninstall
        run: |
          pkill -f 'Contents/MacOS/firefox ' || true
          sleep 2
          ./macos/uninstall.sh --remove-profile
          test ! -e "$HOME/Applications/Firefox PDF Reader.app"

      # --- The download: FirefoxPDFReader.dmg, installed by dragging ---
      - name: Build the disk image
        run: bash ./macos/build-dmg.sh dist "1.0.${{ github.run_number }}"

      - name: Install from the disk image (drag to Applications)
        run: |
          hdiutil attach dist/FirefoxPDFReader.dmg -nobrowse -mountpoint /Volumes/FirefoxPDFReader
          ls -la /Volumes/FirefoxPDFReader
          test -L /Volumes/FirefoxPDFReader/Applications
          cp -R "/Volumes/FirefoxPDFReader/Firefox PDF Reader.app" /Applications/
          hdiutil detach /Volumes/FirefoxPDFReader

      - name: First launch sets it up
        run: |
          . tests/macos/reader-windows.sh
          open -a "/Applications/Firefox PDF Reader.app"
          PROFILE="$HOME/Library/Application Support/FirefoxPDF"
          for i in $(seq 1 60); do [ -f "$PROFILE/.default-app" ] && break; sleep 1; done
          ls -la "$PROFILE" "$PROFILE/chrome"
          sleep 3
          answer_default_app_question
          HANDLER="$(osascript -l JavaScript -e "ObjC.import('AppKit'); \$.NSWorkspace.sharedWorkspace.URLForApplicationToOpenURL(\$.NSURL.fileURLWithPath('$PDFS/paper.pdf')).path.js")"
          echo "PDF handler: $HANDLER"
          # macOS may wait for the person to click "Use Firefox PDF Reader"
          if [ "$HANDLER" = "/Applications/Firefox PDF Reader.app" ]; then echo "IS_DEFAULT=1" >> "$GITHUB_ENV"
          else echo "::notice::Default not switched yet: macOS is asking the user to confirm"; fi
          # Close the welcome dialog
          pkill -f "Firefox PDF Reader.app" || true

      - name: Double-click a PDF
        run: |
          . tests/macos/reader-windows.sh
          if [ "${IS_DEFAULT:-}" = 1 ]; then open "$PDFS/paper.pdf"
          else open -a "/Applications/Firefox PDF Reader.app" "$PDFS/paper.pdf"; fi
          wait_title paper.pdf 90
          reader_processes | grep 'Application Support/FirefoxPDF' | grep -q -- '-new-window .*paper.pdf'
          front_fills_screen

      - name: Screenshot (disk image install)
        if: always()
        run: |
          sleep 8
          screencapture -x "$RUNNER_TEMP/dmg-screenshot-${{ matrix.os }}.png" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-screenshot-${{ matrix.os }}
          path: ${{ runner.temp }}/dmg-screenshot-*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15'
        with:
          name: package-dmg
          path: dist/FirefoxPDFReader.dmg

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test tools and make the test PDFs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox imagemagick xdg-utils desktop-file-utils libgtk-3-bin dbus-x11 wmctrl xdotool x11-utils poppler-utils
          python -m pip install --quiet pypdf pillow numpy
          command -v firefox && firefox --version
          # A virtual screen with a window manager, as on any desktop (openbox
          # draws title bars and does Alt+Tab and Alt+F4), and a session bus,
          # over which Firefox hands a second PDF to the running reader
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          DISPLAY=:99 openbox &
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "PDFS=$RUNNER_TEMP/pdfs" >> "$GITHUB_ENV"
          echo "SHOTS=$RUNNER_TEMP/shots" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/shots"
          python tests/make_test_pdfs.py "$RUNNER_TEMP/pdfs"
          cp "$RUNNER_TEMP/pdfs/chart.pdf" "$RUNNER_TEMP/pdfs/chart page #1 & 50% é.pdf"

      # An update: an install of the last version that used kiosk mode and
      # recoloured the pages, which leaves its settings in the profile, then
      # this version's installer run over it.
      - name: Start from an installed reader of the old kind (version 248c084)
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/archive/248c084395bf65ad6cba1a5cf98a7ac4256d5017.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          sh "$RUNNER_TEMP"/firefox-pdf-reader-248c084*/linux/install.sh
          grep -q -- --kiosk "$HOME/.local/bin/firefox-pdf-reader"
          "$HOME/.local/bin/firefox-pdf-reader" "$PDFS/figure.pdf" &
          . tests/linux/reader-windows.sh
          wait_title figure.pdf 90
          PREFS="$HOME/.local/share/firefox-pdf-reader/prefs.js"
          for i in $(seq 1 60); do grep -q '"pdfjs.forcePageColors", true' "$PREFS" 2>/dev/null && break; sleep 1; done
          grep '"pdfjs.forcePageColors", true' "$PREFS"
          sleep 8
          # What the old version did to the colour figure: share of colourful
          # pixels on screen (for the record; the new version is compared with
          # poppler further down)
          shot "$SHOTS/0-old-version-figure.png"
          python -c "import numpy as np, PIL.Image as I, sys; a = np.asarray(I.open(sys.argv[1]).convert('RGB')).astype(int); print('colourful pixels on screen, old version: %.4f%%' % (100 * ((a.max(2) - a.min(2)) > 40).mean()))" "$SHOTS/0-old-version-figure.png"
          pkill -f -- --kiosk
          sleep 3

      - name: Install this version over it (running the installer again is the whole update)
        run: |
          ./linux/install.sh
          cat "$HOME/.local/bin/firefox-pdf-reader"
          if grep -q -- --kiosk "$HOME/.local/bin/firefox-pdf-reader"; then echo "MISS: the launcher still uses kiosk mode"; exit 1; fi
          grep -q -- -new-window "$HOME/.local/bin/firefox-pdf-reader"

      - name: Check it is the default PDF app
        run: |
          test -x "$HOME/.local/bin/firefox-pdf-reader"
          desktop-file-validate "$HOME/.local/share/applications/firefox-pdf-reader.desktop"
          [ "$(xdg-mime query default application/pdf)" = "firefox-pdf-reader.desktop" ]

      - name: Check the profile
        run: |
          P="$(sed -n 's/.*-profile "\([^"]*\)".*/\1/p' "$HOME/.local/bin/firefox-pdf-reader")"
          echo "PROFILE=$P" >> "$GITHUB_ENV"
          ls -la "$P" "$P/chrome"
          cmp profile/user.js "$P/user.js"
          cmp profile/chrome/userChrome.css "$P/chrome/userChrome.css"
          cmp profile/chrome/userContent.css "$P/chrome/userContent.css"
          diff -r viewer "$P/viewer" && echo "viewer: $(cat "$P/viewer/VERSION")"
          # The desktop entry runs the launcher by its plain path, with no
          # quotes, which xdg-open can run on any desktop
          grep -x "Exec=$HOME/.local/bin/firefox-pdf-reader %F" "$HOME/.local/share/applications/firefox-pdf-reader.desktop"

      - name: Open a PDF with xdg-open, through the desktop entry (what a double-click runs)
        run: |
          . tests/linux/reader-windows.sh
          echo "desktop: ${XDG_CURRENT_DESKTOP:-none known}"
          # (xdg-open waits for the program it starts, here the reader, so it runs in the background)
          xdg-open "$PDFS/paper.pdf" > /tmp/xdg-open.log 2>&1 &
          wait_title paper.pdf 90 || { cat /tmp/xdg-open.log; exit 1; }
          sleep 5
          shot "$SHOTS/1-first-pdf.png"
          echo "--- windows:"; reader_windows
          echo "--- processes:"; reader_processes
          reader_processes | grep -F -- "-profile $PROFILE" | grep -q -- '-new-window .*paper.pdf'
          id="$(window_id paper.pdf)"; xprop -id "$id" _NET_WM_STATE
          is_maximized "$id"
          if is_fullscreen "$id"; then echo "MISS: the window is still full screen"; exit 1; fi

      - name: Open a second PDF while the reader runs
        run: |
          . tests/linux/reader-windows.sh
          gtk-launch firefox-pdf-reader "$PDFS/figure.pdf"
          wait_windows 2 90
          wait_title figure.pdf
          sleep 5
          echo "--- the window manager's list (what Alt+Tab goes through):"; wmctrl -lx
          echo "--- Firefox main processes (one running reader):"; reader_processes
          [ "$(reader_processes | grep -c .)" -eq 1 ]
          for t in paper.pdf figure.pdf; do
            id="$(window_id $t)"; echo "$t: $(xprop -id "$id" _NET_WM_STATE)"; is_maximized "$id"
          done
          echo "front: $(front_title)"; front_title | grep -q figure.pdf
          sleep 8   # pages drawn
          shot "$SHOTS/2-second-pdf.png"

      - name: Check Firefox loaded the reader settings
        run: |
          PREFS="$PROFILE/prefs.js"
          for i in $(seq 1 60); do grep -q 'browser.tabs.inTitlebar' "$PREFS" 2>/dev/null && break; sleep 1; done
          grep -E 'pdfjs\.|inTitlebar|open_newwindow|legacyUserProfileCustomizations|fullscreen|fileuri' "$PREFS"
          # The old version's recolouring is gone from the updated profile
          if grep -q '"pdfjs.forcePageColors", true' "$PREFS"; then echo "MISS: pages are still recoloured"; exit 1; fi
          grep -q '"browser.tabs.inTitlebar", 0' "$PREFS"
          grep -q '"security.fileuri.strict_origin_policy", false' "$PREFS"

      - name: Colours and sharpness of a colour figure, against poppler's drawing
        run: python tests/compare_colours.py "$SHOTS/2-second-pdf.png" "$PDFS/figure.pdf" "$SHOTS" --name colours-ubuntu

      - name: A web link in the PDF opens in a new window
        run: |
          . tests/linux/reader-windows.sh
          # The test PDF has an invisible link to example.com across the band
          # 20-50 points below the top of its page (tests/make_test_pdfs.py)
          click_page_point "$SHOTS/colours-ubuntu.json" 35
          wait_windows 3 60
          wait_title "Example Domain" 60
          sleep 2
          shot "$SHOTS/2b-link-in-new-window.png"
          xdotool key ctrl+w
          wait_windows 2
          xdotool mousemove 800 600

      - name: Alt+Tab switches to the other PDF
        run: |
          . tests/linux/reader-windows.sh
          echo "front before: $(front_title)"
          xdotool key alt+Tab
          sleep 2
          echo "front after: $(front_title)"
          front_title | grep -q paper.pdf
          shot "$SHOTS/3-alt-tab.png"

      - name: F11 makes it full screen, and F11 takes it back to a window
        run: |
          . tests/linux/reader-windows.sh
          id="$(window_id paper.pdf)"
          xdotool key F11
          sleep 2
          xprop -id "$id" _NET_WM_STATE
          is_fullscreen "$id"
          shot "$SHOTS/4-full-screen-with-note.png"
          sleep 8
          # In full screen, the mouse at the top edge brings down Firefox's bar
          # with its buttons to leave full screen or close
          xdotool mousemove 800 0
          sleep 3
          shot "$SHOTS/5-full-screen-mouse-at-top.png"
          xdotool mousemove 800 600
          sleep 2
          xdotool key F11
          sleep 3
          xprop -id "$id" _NET_WM_STATE
          if is_fullscreen "$id"; then echo "MISS: the window is still full screen"; exit 1; fi
          is_maximized "$id"
          shot "$SHOTS/6-window-again.png"

      - name: A page of text, a picture and a chart - black page, white text, the picture and the chart in their own colours
        run: |
          . tests/linux/reader-windows.sh
          xdotool mousemove 5 500
          gtk-launch firefox-pdf-reader "$PDFS/chart page #1 & 50% é.pdf"
          wait_windows 3 90
          wait_title "chart page #1 & 50%"
          sleep 2
          echo "front: $(front_title)"; front_title | grep -qF "chart page #1 & 50%"
          sleep 8   # page drawn
          shot "$SHOTS/7-chart-page.png"
          python tests/check_dark_page.py "$SHOTS/7-chart-page.png" "$PDFS/chart.pdf" "$SHOTS" --name dark-page-ubuntu
          # Find: Ctrl+F opens the viewer's find bar at the top right
          xdotool key ctrl+f
          sleep 1
          xdotool type --delay 60 picture
          xdotool key Return
          sleep 2
          shot "$SHOTS/8-find.png"
          python tests/find_bar_shown.py "$SHOTS/7-chart-page.png" "$SHOTS/8-find.png" "$SHOTS/dark-page-ubuntu.json"
          xdotool key Escape
          sleep 1
          xdotool key ctrl+w
          wait_windows 2

      - name: A scanned page, coloured boxes and labels on pictures - dark letters on their paper, readable text on every box
        run: |
          . tests/linux/reader-windows.sh
          xdotool mousemove 5 500
          gtk-launch firefox-pdf-reader "$PDFS/mixed.pdf"
          wait_windows 3 90
          wait_title mixed.pdf
          sleep 2
          echo "front: $(front_title)"; front_title | grep -q mixed.pdf
          sleep 8   # page drawn
          shot "$SHOTS/8b-mixed-page.png"
          python tests/check_mixed_page.py "$SHOTS/8b-mixed-page.png" "$PDFS/mixed.pdf" "$SHOTS" --name mixed-page-ubuntu
          xdotool key ctrl+w
          wait_windows 2

      - name: A PDF given by its file:// address opens in the reader (black page); a PDF on the web in Firefox's own viewer (white page)
        run: |
          . tests/linux/reader-windows.sh
          xdotool mousemove 5 500
          url="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())' "$PDFS/chart.pdf")"
          echo "$url"
          "$HOME/.local/bin/firefox-pdf-reader" "$url" &
          wait_windows 3 90
          wait_title chart.pdf
          sleep 8   # page drawn
          echo "front: $(front_title)"
          shot "$SHOTS/8c-file-address.png"
          python tests/page_colour.py "$SHOTS/8c-file-address.png" black
          xdotool key ctrl+w
          wait_windows 2
          # A PDF on the web: what a web link in a PDF opens, in a new window
          python -m http.server 8765 --bind 127.0.0.1 --directory "$PDFS" > /tmp/http.log 2>&1 &
          sleep 2
          "$HOME/.local/bin/firefox-pdf-reader" "http://127.0.0.1:8765/chart.pdf" &
          wait_windows 3 90
          wait_title chart.pdf
          sleep 8   # page drawn
          echo "front: $(front_title)"
          shot "$SHOTS/8d-web-address.png"
          python tests/page_colour.py "$SHOTS/8d-web-address.png" white
          xdotool key ctrl+w
          wait_windows 2

      - name: Ctrl+W closes one PDF, Alt+F4 the other, and the reader ends
        run: |
          . tests/linux/reader-windows.sh
          xdotool key ctrl+w
          wait_windows 1
          xdotool key alt+F4
          wait_windows 0
          for i in $(seq 1 30); do [ -z "$(reader_processes)" ] && break; sleep 1; done
          [ -z "$(reader_processes)" ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ubuntu
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Uninstall
        run: |
          pkill -f -- '-profile' || true
          sleep 2
          ./linux/uninstall.sh --remove-profile
          test ! -e "$HOME/.local/bin/firefox-pdf-reader"

      - name: One-step installer (docs/install/install.sh)
        run: |
          sh docs/install/install.sh
          test -x "$HOME/.local/bin/firefox-pdf-reader"
          [ "$(xdg-mime query default application/pdf)" = "firefox-pdf-reader.desktop" ]
          ./linux/uninstall.sh --remove-profile

      # --- The download: firefox-pdf-reader .deb, installed by double-clicking ---
      - name: Build the .deb
        run: sh linux/package/build-deb.sh dist "1.0.${{ github.run_number }}"

      - name: Install the .deb (what double-clicking it does)
        run: |
          rm -f "$HOME/.config/mimeapps.list"   # forget the per-user default from the earlier tests
          sudo apt-get install -y ./dist/firefox-pdf-reader_*_all.deb
          dpkg -L firefox-pdf-reader
          grep pdf /etc/xdg/mimeapps.list
          [ "$(xdg-mime query default application/pdf)" = "firefox-pdf-reader.desktop" ]

      - name: Double-click a PDF
        run: |
          . tests/linux/reader-windows.sh
          pkill -f -- '-profile' || true; sleep 2
          gtk-launch firefox-pdf-reader "$PDFS/paper.pdf"
          wait_title paper.pdf 90
          reader_processes | grep -F -- "-profile $HOME/.local/share/firefox-pdf-reader" | grep -q -- '-new-window .*paper.pdf'
          is_maximized "$(window_id paper.pdf)"
          ls "$HOME/.local/share/firefox-pdf-reader/chrome/userChrome.css"

      - name: Screenshot (.deb install)
        if: always()
        run: |
          sleep 8
          import -window root "$RUNNER_TEMP/deb-screenshot-ubuntu.png" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deb-screenshot-ubuntu
          path: ${{ runner.temp }}/deb-screenshot-ubuntu.png
          if-no-files-found: ignore

      - name: Remove the .deb
        run: |
          pkill -f -- '-profile' || true
          sudo apt-get remove -y firefox-pdf-reader
          if grep -q firefox-pdf-reader /etc/xdg/mimeapps.list; then echo "MISS: the default PDF app entry is still there"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: dist/firefox-pdf-reader_*_all.deb

  # ChromeOS's Linux environment (Crostini) is a Debian 12 container with a
  # regular user who has password-less sudo. GitHub can't run ChromeOS itself,
  # so this recreates that: Debian 12, Crostini's marker directory, and a
  # normal user running the ChromeOS installer.
  chromeos:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    env:
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v4

      - name: Set up a Crostini-like container
        run: |
          apt-get update
          apt-get install -y sudo python3 python3-numpy python3-pil xvfb openbox imagemagick xdg-utils desktop-file-utils procps dbus-x11 wmctrl xdotool x11-utils poppler-utils
          mkdir -p /opt/google/cros-containers
          useradd -m -s /bin/bash penguin
          echo 'penguin ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/penguin
          cp -r "$GITHUB_WORKSPACE" /home/penguin/firefox-pdf-reader
          chown -R penguin:penguin /home/penguin/firefox-pdf-reader
          cp docs/example.pdf /home/penguin/paper.pdf
          pdfseparate -f 5 -l 5 docs/example.pdf /home/penguin/figure.pdf
          python3 tests/make_test_pdfs.py /home/penguin --chart-only
          cp /home/penguin/chart.pdf "/home/penguin/chart page #1 & 50% é.pdf"
          chown penguin /home/penguin/*.pdf
          mkdir -p /tmp/shots
          Xvfb :99 -screen 0 1600x1000x24 &
          # The window manager starts once the screen answers, and the step
          # waits until it runs (openbox started too early sometimes exited,
          # leaving no window list for the steps below)
          for i in $(seq 1 60); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.5; done
          openbox &
          for i in $(seq 1 60); do wmctrl -m >/dev/null 2>&1 && break; sleep 0.5; done
          wmctrl -m
          # penguin's session bus, as ChromeOS's Linux has; Firefox hands a
          # second PDF to the running reader over it
          eval "$(runuser -u penguin -- dbus-launch --sh-syntax)"
          echo "AS_USER=runuser -u penguin -- env HOME=/home/penguin DISPLAY=:99 DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Install the reader (installs Firefox ESR first)
        run: $AS_USER sh /home/penguin/firefox-pdf-reader/chromeos/install.sh

      - name: Check it is the default PDF app
        run: |
          command -v firefox-esr
          [ "$($AS_USER xdg-mime query default application/pdf)" = "firefox-pdf-reader.desktop" ]

      - name: Open two PDFs, one after the other
        run: |
          . tests/linux/reader-windows.sh
          $AS_USER /home/penguin/.local/bin/firefox-pdf-reader /home/penguin/paper.pdf > /tmp/firefox.log 2>&1 &
          wait_title paper.pdf 90 || { cat /tmp/firefox.log; exit 1; }
          sleep 5
          shot /tmp/shots/1-first-pdf.png
          is_maximized "$(window_id paper.pdf)"
          $AS_USER /home/penguin/.local/bin/firefox-pdf-reader /home/penguin/figure.pdf > /tmp/firefox2.log 2>&1 &
          wait_windows 2 90 || { cat /tmp/firefox.log /tmp/firefox2.log; exit 1; }
          wait_title figure.pdf
          sleep 5
          echo "--- the window manager's list:"; wmctrl -lx
          echo "--- Firefox main processes:"; reader_processes
          [ "$(reader_processes | grep -c .)" -eq 1 ]
          for t in paper.pdf figure.pdf; do is_maximized "$(window_id $t)"; done
          sleep 8
          shot /tmp/shots/2-second-pdf.png

      - name: Check Firefox loaded the reader settings
        run: |
          PREFS="/home/penguin/.local/share/firefox-pdf-reader/prefs.js"
          for i in $(seq 1 60); do grep -q 'browser.tabs.inTitlebar' "$PREFS" 2>/dev/null && break; sleep 1; done
          grep -E 'pdfjs\.|inTitlebar|open_newwindow|legacyUserProfileCustomizations|fileuri' "$PREFS" || { cat /tmp/firefox.log; exit 1; }
          if grep -q '"pdfjs.forcePageColors", true' "$PREFS"; then echo "MISS: pages are still recoloured"; exit 1; fi
          grep -q '"security.fileuri.strict_origin_policy", false' "$PREFS"

      - name: F11 makes it full screen and takes it back
        run: |
          . tests/linux/reader-windows.sh
          id="$(window_id figure.pdf)"
          xdotool windowactivate --sync "$id"
          xdotool key F11
          sleep 3
          is_fullscreen "$id"
          shot /tmp/shots/3-full-screen-with-note.png
          xdotool key F11
          sleep 3
          if is_fullscreen "$id"; then echo "MISS: the window is still full screen"; exit 1; fi

      - name: A page of text, a picture and a chart - black page, white text, the picture and the chart in their own colours
        run: |
          . tests/linux/reader-windows.sh
          firefox-esr --version
          $AS_USER /home/penguin/.local/bin/firefox-pdf-reader "/home/penguin/chart page #1 & 50% é.pdf" > /tmp/firefox3.log 2>&1 &
          wait_windows 3 90 || { cat /tmp/firefox3.log; exit 1; }
          wait_title "chart page #1 & 50%"
          sleep 10   # page drawn
          shot /tmp/shots/4-chart-page.png
          python3 tests/check_dark_page.py /tmp/shots/4-chart-page.png /home/penguin/chart.pdf /tmp/shots --name dark-page-chromeos

      - name: A scanned page, coloured boxes and labels on pictures - dark letters on their paper, readable text on every box
        run: |
          . tests/linux/reader-windows.sh
          $AS_USER /home/penguin/.local/bin/firefox-pdf-reader /home/penguin/mixed.pdf > /tmp/firefox4.log 2>&1 &
          wait_windows 4 90 || { cat /tmp/firefox4.log; exit 1; }
          wait_title mixed.pdf
          xdotool windowactivate --sync "$(window_id mixed.pdf)"
          sleep 10   # page drawn
          shot /tmp/shots/5-mixed-page.png
          python3 tests/check_mixed_page.py /tmp/shots/5-mixed-page.png /home/penguin/mixed.pdf /tmp/shots --name mixed-page-chromeos

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-chromeos
          path: /tmp/shots
          if-no-files-found: ignore

      # --- The .deb, as ChromeOS's Files app installs it ("Install with Linux") ---
      - name: Install the .deb
        run: |
          pkill -f -- '-profile' || true
          sh linux/package/build-deb.sh /tmp/dist "1.0.${{ github.run_number }}"
          sh /home/penguin/firefox-pdf-reader/linux/uninstall.sh --remove-profile || true
          rm -f /home/penguin/.config/mimeapps.list
          apt-get install -y /tmp/dist/firefox-pdf-reader_*_all.deb
          [ "$($AS_USER xdg-mime query default application/pdf)" = "firefox-pdf-reader.desktop" ]

      - name: Open a PDF with the installed package
        run: |
          . tests/linux/reader-windows.sh
          sleep 2
          $AS_USER firefox-pdf-reader /home/penguin/paper.pdf > /tmp/firefox-deb.log 2>&1 &
          wait_title paper.pdf 90 || { cat /tmp/firefox-deb.log; exit 1; }
          reader_processes | grep -q -- '-new-window .*paper.pdf'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make sure Firefox is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles\Mozilla Firefox\firefox.exe")) { choco install firefox -y --no-progress }
          (Get-Item "$env:ProgramFiles\Mozilla Firefox\firefox.exe").VersionInfo.ProductVersion

      - name: Install test tools (poppler) and make the test PDFs
        shell: pwsh
        run: |
          python -m pip install --quiet pypdf pillow numpy
          # poppler for Windows, as built from conda-forge's packages by the poppler-windows project
          Invoke-WebRequest https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip -OutFile "$env:RUNNER_TEMP\poppler.zip"
          Expand-Archive "$env:RUNNER_TEMP\poppler.zip" "$env:RUNNER_TEMP\poppler"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\poppler" -Recurse -Filter pdftoppm.exe | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw 'pdftoppm missing' }
          "POPPLER_BIN=$bin" >> $env:GITHUB_ENV
          "PDFS=$env:RUNNER_TEMP\pdfs" >> $env:GITHUB_ENV
          "SHOTS=$env:RUNNER_TEMP\shots" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\shots" | Out-Null
          python tests/make_test_pdfs.py "$env:RUNNER_TEMP\pdfs"
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\pdfs\chart.pdf" -Destination "$env:RUNNER_TEMP\pdfs\chart page #1 & 50% é.pdf"
          Add-Type -AssemblyName System.Windows.Forms
          "screen: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Install the reader
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\windows\install.ps1 -SkipDefaultAppsPage

      - name: Check the registration
        shell: pwsh
        run: |
          $exe = "$env:USERPROFILE\FirefoxPDF\FirefoxPDF.exe"
          if (-not (Test-Path $exe)) { throw "launcher missing" }
          (Get-ItemProperty 'HKCU:\Software\Classes\FirefoxPDFReader\shell\open\command').'(default)'
          (Get-ItemProperty 'HKCU:\Software\RegisteredApplications').FirefoxPDFReader
          Get-ItemProperty 'HKCU:\Software\Classes\.pdf\OpenWithProgids' -Name FirefoxPDFReader | Out-Null

      - name: Check the profile
        shell: pwsh
        run: |
          $p = "$env:USERPROFILE\FirefoxPDF"
          Get-ChildItem $p, "$p\chrome" | Format-Table Name, Length | Out-String | Write-Host
          foreach ($f in 'user.js', 'chrome\userChrome.css', 'chrome\userContent.css') {
            if ((Get-FileHash "profile\$f").Hash -ne (Get-FileHash "$p\$f").Hash) { throw "$f differs from the repository's" }
          }
          # The reader's viewer, file for file
          function Get-Tree($dir) {
            $root = (Resolve-Path $dir).Path
            Get-ChildItem $root -Recurse -File | ForEach-Object { $_.FullName.Substring($root.Length) + ' ' + (Get-FileHash $_.FullName).Hash }
          }
          $diff = Compare-Object @(Get-Tree viewer) @(Get-Tree "$p\viewer")
          if ($diff) { $diff | Out-String | Write-Host; throw 'the viewer in the profile differs from the repository''s' }
          "viewer: " + (Get-Content "$p\viewer\VERSION")

      - name: Open a PDF with the launcher (what a double-click runs)
        shell: pwsh
        run: |
          . .\tests\windows\reader-windows.ps1
          Start-Process "$env:USERPROFILE\FirefoxPDF\FirefoxPDF.exe" -ArgumentList "`"$env:PDFS\paper.pdf`""
          Wait-ReaderWindows 1 90 | Out-Null
          for ($i = 0; $i -lt 60 -and -not (@(Get-ReaderWindows).Title -match 'paper\.pdf'); $i++) { Start-Sleep 1 }
          Start-Sleep 5
          Save-Screen "$env:SHOTS\1-first-pdf.png"
          $w = @(Get-ReaderWindows)
          $w | Format-Table Title, ProcessId, Front, Maximised, FullScreen, TitleBar, Rect -AutoSize | Out-String | Write-Host
          $paper = $w | Where-Object Title -match 'paper\.pdf'
          if (-not $paper) { throw 'no window titled with paper.pdf' }
          if (-not $paper.Maximised -or -not $paper.TitleBar) { throw 'the window does not fill the screen under a title bar' }
          $procs = @(Get-ReaderProcesses)
          $procs | Format-List | Out-String | Write-Host
          if (-not ($procs.CommandLine -match 'FirefoxPDF.*-new-window.*paper\.pdf')) { throw 'Firefox was not started with the reader profile and -new-window' }

      - name: Open a second PDF while the reader runs
        shell: pwsh
        run: |
          . .\tests\windows\reader-windows.ps1
          Start-Process "$env:USERPROFILE\FirefoxPDF\FirefoxPDF.exe" -ArgumentList "`"$env:PDFS\figure.pdf`""
          Wait-ReaderWindows 2 90 | Out-Null
          for ($i = 0; $i -lt 60 -and -not (@(Get-ReaderWindows).Title -match 'figure\.pdf'); $i++) { Start-Sleep 1 }
          Start-Sleep 5
          Write-Host "--- Windows' list of top-level windows (what Alt+Tab goes through), front first:"
          $w = @(Get-ReaderWindows)
          $w | Format-Table Title, ProcessId, Front, Maximised, FullScreen, TitleBar, Rect -AutoSize | Out-String | Write-Host
          if (-not ($w.Title -match 'paper\.pdf') -or -not ($w.Title -match 'figure\.pdf')) { throw 'each PDF should have a window titled with its file name' }
          if (@($w | Where-Object { -not $_.Maximised }).Count) { throw 'both windows should fill the screen' }
          $procs = @(Get-ReaderProcesses)
          $procs | Format-List | Out-String | Write-Host
          if ($procs.Count -ne 1) { throw "expected one running reader, found $($procs.Count) Firefox main processes" }
          $figure = $w | Where-Object Title -match 'figure\.pdf'
          if (-not $figure.Front) {
            Write-Host 'The new window did not come to the front by itself; bringing it forward for the screenshot.'
            Set-Front $figure
          }
          Start-Sleep 8   # pages drawn
          Save-Screen "$env:SHOTS\2-second-pdf.png"

      - name: Check Firefox loaded the reader settings
        shell: pwsh
        run: |
          $prefs = "$env:USERPROFILE\FirefoxPDF\prefs.js"
          for ($i = 0; $i -lt 60; $i++) { if ((Test-Path $prefs) -and (Select-String -Path $prefs -Pattern 'browser.tabs.inTitlebar' -Quiet)) { break }; Start-Sleep 1 }
          Select-String -Path $prefs -Pattern 'pdfjs\.|inTitlebar|open_newwindow|legacyUserProfileCustomizations|fullscreen|fileuri' | ForEach-Object Line
          if (Select-String -Path $prefs -Pattern '"pdfjs.forcePageColors", true' -Quiet) { throw 'pages are still recoloured' }
          if (-not (Select-String -Path $prefs -Pattern '"browser.tabs.inTitlebar", 0' -Quiet)) { throw 'the system title bar setting is missing' }
          if (-not (Select-String -Path $prefs -Pattern '"security.fileuri.strict_origin_policy", false' -Quiet)) { throw 'the local file setting is missing' }

      - name: Colours and sharpness of a colour figure, against poppler's drawing
        shell: pwsh
        run: python tests/compare_colours.py "$env:SHOTS\2-second-pdf.png" "$env:PDFS\figure.pdf" "$env:SHOTS" --name colours-windows

      - name: A web link in the PDF opens in a new window
        shell: pwsh
        run: |
          . .\tests\windows\reader-windows.ps1
          # The test PDF has an invisible link to example.com across the band
          # 20-50 points below the top of its page (tests/make_test_pdfs.py)
          Invoke-PageClick "$env:SHOTS\colours-windows.json" 35
          Wait-ReaderWindows 3 60 | Out-Null
          for ($i = 0; $i -lt 60 -and -not (@(Get-ReaderWindows).Title -match 'Example Domain'); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          Get-ReaderWindows | Format-Table Title, Front, Maximised -AutoSize | Out-String | Write-Host
          Save-Screen "$env:SHOTS\2b-link-in-new-window.png"
          if (-not (@(Get-ReaderWindows).Title -match 'Example Domain')) { throw 'the link did not open in a new window' }
          Send-Keys Ctrl, W
          Wait-ReaderWindows 2 | Out-Null
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 500, 500

      - name: Alt+Tab switches to the other PDF
        shell: pwsh
        run: |
          . .\tests\windows\reader-windows.ps1
          Write-Host "front before: $((Get-ReaderWindows | Where-Object Front).Title)"
          Send-Keys Alt, Tab
          Start-Sleep 3
          $front = Get-ReaderWindows | Where-Object Front
          Write-Host "front after: $($front.Title)"
          Save-Screen "$env:SHOTS\3-alt-tab.png"
          if (-not ($front.Title -match 'paper\.pdf')) { throw 'Alt+Tab did not bring the other PDF to the front' }

      - name: F11 makes it full screen, and F11 takes it back to a window
        shell: pwsh
        run: |
          . .\tests\windows\reader-windows.ps1
          Send-Keys F11
          Start-Sleep 2
          $w = Get-ReaderWindows | Where-Object Title -match 'paper\.pdf'
          $w | Format-Table Title, Front, Maximised, FullScreen, TitleBar, Rect -AutoSize | Out-String | Write-Host
          Save-Screen "$env:SHOTS\4-full-screen-with-note.png"
          if (-not $w.FullScreen) { throw 'F11 did not make the window full screen' }
          Start-Sleep 8
          # In full screen, the mouse at the top edge brings down Firefox's bar
          # with its buttons to leave full screen or close
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 500, 0
          Start-Sleep 3
          Save-Screen "$env:SHOTS\5-full-screen-mouse-at-top.png"
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 500, 500
          Start-Sleep 2
          Send-Keys F11
          Start-Sleep 3
          $w = Get-ReaderWindows | Where-Object Title -match 'paper\.pdf'
          $w | Format-Table Title, Front, Maximised, FullScreen, TitleBar, Rect -AutoSize | Out-String | Write-Host
          Save-Screen "$env:SHOTS\6-window-again.png"
          if ($w.FullScreen -or -not $w.TitleBar) { throw 'F11 did not take it back to a window with a title bar' }

      - name: A page of text, a picture and a chart - black page, white text, the picture and the chart in their own colours
        shell: pwsh
        run: |
          . .\tests\windows\reader-windows.ps1
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 5, 400
          Start-Process "$env:USERPROFILE\FirefoxPDF\FirefoxPDF.exe" -ArgumentList "`"$env:PDFS\chart page #1 & 50% é.pdf`""
          Wait-ReaderWindows 3 90 | Out-Null
          for ($i = 0; $i -lt 60 -and -not (@(Get-ReaderWindows).Title -match 'chart page #1 & 50%'); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          $chart = Get-ReaderWindows | Where-Object Title -match 'chart page #1 & 50%'
          if (-not $chart.Front) { Set-Front $chart }
          Get-ReaderWindows | Format-Table Title, Front, Maximised -AutoSize | Out-String | Write-Host
          Start-Sleep 8   # page drawn
          Save-Screen "$env:SHOTS\7-chart-page.png"
          python tests/check_dark_page.py "$env:SHOTS\7-chart-page.png" "$env:PDFS\chart.pdf" "$env:SHOTS" --name dark-page-windows
          if ($LASTEXITCODE) { throw 'the black page, white text and colours check missed' }
          # Find: Ctrl+F opens the viewer's find bar at the top right
          [System.Windows.Forms.SendKeys]::SendWait('^f')
          Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait('picture{ENTER}')
          Start-Sleep 2
          Save-Screen "$env:SHOTS\8-find.png"
          python tests/find_bar_shown.py "$env:SHOTS\7-chart-page.png" "$env:SHOTS\8-find.png" "$env:SHOTS\dark-page-windows.json"
          if ($LASTEXITCODE) { throw 'the find bar did not open' }
          Send-Keys Esc
          Start-Sleep 1
          Send-Keys Ctrl, W
          Wait-ReaderWindows 2 | Out-Null

      - name: A scanned page, coloured boxes and labels on pictures - dark letters on their paper, readable text on every box
        shell: pwsh
        run: |
          . .\tests\windows\reader-windows.ps1
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 5, 400
          Start-Process "$env:USERPROFILE\FirefoxPDF\FirefoxPDF.exe" -ArgumentList "`"$env:PDFS\mixed.pdf`""
          Wait-ReaderWindows 3 90 | Out-Null
          for ($i = 0; $i -lt 60 -and -not (@(Get-ReaderWindows).Title -match 'mixed\.pdf'); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          $mixed = Get-ReaderWindows | Where-Object Title -match 'mixed\.pdf'
          if (-not $mixed.Front) { Set-Front $mixed }
          Get-ReaderWindows | Format-Table Title, Front, Maximised -AutoSize | Out-String | Write-Host
          Start-Sleep 8   # page drawn
          Save-Screen "$env:SHOTS\8b-mixed-page.png"
          python tests/check_mixed_page.py "$env:SHOTS\8b-mixed-page.png" "$env:PDFS\mixed.pdf" "$env:SHOTS" --name mixed-page-windows
          if ($LASTEXITCODE) { throw 'the scanned page, boxes and labels check missed' }
          Send-Keys Ctrl, W
          Wait-ReaderWindows 2 | Out-Null

      - name: A PDF given by its file:/// address opens in the reader (black page)
        shell: pwsh
        run: |
          . .\tests\windows\reader-windows.ps1
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 5, 400
          $url = ([System.Uri](Resolve-Path "$env:PDFS\chart.pdf").Path).AbsoluteUri
          Write-Host $url
          Start-Process "$env:USERPROFILE\FirefoxPDF\FirefoxPDF.exe" -ArgumentList "`"$url`""
          Wait-ReaderWindows 3 90 | Out-Null
          for ($i = 0; $i -lt 60 -and -not (@(Get-ReaderWindows).Title -match 'chart\.pdf'); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          $byAddress = Get-ReaderWindows | Where-Object Title -match 'chart\.pdf'
          if (-not $byAddress.Front) { Set-Front $byAddress }
          Get-ReaderWindows | Format-Table Title, Front, Maximised -AutoSize | Out-String | Write-Host
          Start-Sleep 8   # page drawn
          Save-Screen "$env:SHOTS\8c-file-address.png"
          python tests/page_colour.py "$env:SHOTS\8c-file-address.png" black
          if ($LASTEXITCODE) { throw 'a PDF given by its file address did not open on a black page' }
          Send-Keys Ctrl, W
          Wait-ReaderWindows 2 | Out-Null

      - name: Ctrl+W closes one PDF, Alt+F4 the other, and the reader ends
        shell: pwsh
        run: |
          . .\tests\windows\reader-windows.ps1
          Send-Keys Ctrl, W
          Wait-ReaderWindows 1 | Format-Table Title -AutoSize | Out-String | Write-Host
          Send-Keys Alt, F4
          Wait-ReaderWindows 0 | Out-Null
          for ($i = 0; $i -lt 30 -and @(Get-ReaderProcesses).Count; $i++) { Start-Sleep 1 }
          if (@(Get-ReaderProcesses).Count) { throw 'Firefox is still running' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Uninstall
        shell: powershell
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          powershell -ExecutionPolicy Bypass -File .\windows\uninstall.ps1 -RemoveProfile
          if (Test-Path 'HKCU:\Software\Classes\FirefoxPDFReader') { throw "registry entries left behind" }

      - name: One-step installer (docs/install/windows.ps1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\docs\install\windows.ps1
          if (-not (Test-Path "$env:USERPROFILE\FirefoxPDF\FirefoxPDF.exe")) { throw "launcher missing" }
          if (-not (Test-Path 'HKCU:\Software\Classes\FirefoxPDFReader')) { throw "not registered" }
          powershell -ExecutionPolicy Bypass -File .\windows\uninstall.ps1 -RemoveProfile

  # viewer/ is pdf.js's official release with nothing but the reader's
  # changes: tools/make_viewer.py builds it again from the release (checked
  # against its SHA-256) and the result must be the same, file for file.
  viewer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build viewer/ again from pdf.js's release and compare
        run: |
          python3 tools/make_viewer.py "$RUNNER_TEMP/viewer"
          diff -r viewer "$RUNNER_TEMP/viewer"
          cat viewer/VERSION
          grep -c "Firefox PDF Reader" viewer/build/pdf.mjs

  # After every platform passes on main, publish the downloads to the
  # "latest" release, so these links always serve the newest version:
  #   https://github.com/Gregory-Schwing-MD-PhD/firefox-pdf-reader/releases/latest/download/FirefoxPDFReader.dmg
  #   https://github.com/Gregory-Schwing-MD-PhD/firefox-pdf-reader/releases/latest/download/FirefoxPDFReader.deb
  #   https://github.com/Gregory-Schwing-MD-PhD/firefox-pdf-reader/releases/latest/download/FirefoxPDFReader-Setup.cmd
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [macos, linux, chromeos, windows, viewer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Publish the downloads
        run: |
          mkdir -p upload
          cp dist/FirefoxPDFReader.dmg upload/FirefoxPDFReader.dmg
          cp dist/firefox-pdf-reader_*_all.deb upload/FirefoxPDFReader.deb
          cp docs/install/FirefoxPDFReader-Setup.cmd upload/FirefoxPDFReader-Setup.cmd
          ls -la upload
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Firefox PDF Reader" --latest \
              --notes "Downloads for Firefox PDF Reader. Get the right one for your computer at https://gregory-schwing-md-phd.github.io/firefox-pdf-reader/"
          fi
          gh release upload latest upload/* --clobber
          gh release edit latest --notes "Downloads for Firefox PDF Reader, built from ${GITHUB_SHA::7} (run ${{ github.run_number }}). Get the right one for your computer at https://gregory-schwing-md-phd.github.io/firefox-pdf-reader/"
